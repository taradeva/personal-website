      function ScrollToTop() {
        const { pathname } = useLocation();
        useEffect(() => window.scrollTo({ top: 0, behavior: "smooth" }), [pathname]);
        return null;
      }

      function useRevealOnScroll() {
        useEffect(() => {
          const observer = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  entry.target.classList.add("is-visible");
                  observer.unobserve(entry.target);
                }
              });
            },
            { threshold: 0.14 }
          );

          document.querySelectorAll(".reveal").forEach((el) => observer.observe(el));
          return () => observer.disconnect();
        }, []);
      }

      function Nav() {
        const [open, setOpen] = useState(false);
        const [scrolled, setScrolled] = useState(false);
        const [activeSection, setActiveSection] = useState("top");
        const location = useLocation();
        const navigate = useNavigate();

        useEffect(() => {
          const onScroll = () => {
            setScrolled(window.scrollY > 24);

            if (location.pathname !== "/") {
              setActiveSection(location.pathname.replace("/", "") || "top");
              return;
            }

            const sections = ["work", "about", "contact"];
            const current = sections.reduce((active, id) => {
              const section = document.getElementById(id);
              if (!section) return active;
              const top = section.getBoundingClientRect().top;
              return top <= window.innerHeight * 0.38 ? id : active;
            }, "top");
            setActiveSection(current);
          };
          onScroll();
          window.addEventListener("scroll", onScroll);
          return () => window.removeEventListener("scroll", onScroll);
        }, [location.pathname]);

        const goHomeAnchor = (anchor) => {
          setOpen(false);
          navigate("/");
          setTimeout(() => document.querySelector(anchor)?.scrollIntoView({ behavior: "smooth" }), 80);
        };

                    {project.video && (
                      <figure>
                        <video className="case-video" controls playsInline preload="metadata" poster={project.heroImage}>
                          <source src={project.video} type="video/mp4" />
                        </video>
                        <figcaption>Mixed reality experience asset</figcaption>
                      </figure>
                    )}
                    {project.assets?.length > 0 && (
                      <div className="asset-grid">
                        {project.assets.map((asset, index) => (
                          <figure key={asset}>
                            <img src={asset} alt={`${project.shortTitle} asset ${index + 1}`} />
                            <figcaption>{project.assetCaptions?.[index] || (project.video ? "Redacted creator shortlist document" : `${project.shortTitle} asset ${index + 1}`)}</figcaption>
                          </figure>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </CaseSection>
              <CaseSection id="reflection" title="Reflection">{project.sections.reflection}</CaseSection>
            </article>
            <ContactFooter compact />
          </main>
        );
      }

      function CaseSection({ id, title, children }) {
        const renderChildren = (content) => {
          if (Array.isArray(content)) {
            return content.flatMap((item) => renderChildren(item));
          }

          if (content?.type === "numbered") {
            return (
              <ol className="case-list" key={content.items.join("|")}>
                {content.items.map((item) => <li key={item}>{item}</li>)}
              </ol>
            );
          }

          if (content?.type === "caseNote") {
            return <p className="case-note" key={content.text}>{content.text}</p>;
          }

          if (content?.type === "prepGrid") {
            return (
              <div className="prep-grid" key={content.label}>
                <span className="prep-label" tabIndex="0" data-note={content.note}>{content.label}</span>
                <div className="prep-items">
                  {content.items.map(([label, detail], index) => (
                    <div className="prep-item" key={label}>
                      <span>{String(index + 1).padStart(2, "0")}</span>
                      <strong>{label}</strong>
                      <p>{detail}</p>
                    </div>
                  ))}
                </div>
              </div>
            );
          }

          if (typeof content === "string") {
            return <p key={content}>{content}</p>;
          }

          return content;
        };

        return (
          <section id={id} className="case-section reveal">
            <div className="section-kicker">
              <h3>{title}</h3>
            </div>
            {renderChildren(children)}
          </section>
        );
      }

      function ContactFooter({ compact = false }) {
        return (
          <footer id="contact" className={`contact-footer ${compact ? "contact-footer--compact" : ""}`}>
            <div className="mx-auto max-w-[900px] px-5 text-center reveal">
              <h2>Let's build something worth talking about.</h2>
              <div className="contact-links">
                <a href="mailto:taradevaraj@gmail.com">taradevaraj@gmail.com</a>
                <a href="https://linkedin.com/in/taradevaraj" target="_blank" rel="noreferrer">linkedin.com/in/taradevaraj</a> {/* PLACEHOLDER: LinkedIn URL */}
              </div>
              <small>© 2026 Tara Devaraj</small>
            </div>
          </footer>
        );
      }

      function App() {
        useEffect(() => {
          const onPointerMove = (event) => {
            document.documentElement.style.setProperty("--cursor-x", `${event.clientX}px`);
            document.documentElement.style.setProperty("--cursor-y", `${event.clientY}px`);
          };
          window.addEventListener("pointermove", onPointerMove);
          return () => window.removeEventListener("pointermove", onPointerMove);
        }, []);

        return (
          <HashRouter>
            <ScrollToTop />
            <Nav />
            <Routes>
              <Route path="/" element={<Home />} />
              <Route path="/tools" element={<ToolsPage />} />
              {projects.map((project) => (
                <Route key={project.slug} path={`/case-study/${project.slug}`} element={<CaseStudy project={project} />} />
              ))}
            </Routes>
          </HashRouter>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
